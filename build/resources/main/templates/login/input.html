<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebPortal.com</title>
    <link rel="icon" th:href="@{/img/common/favicon.ico}" href="../../static/img/common/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css" />
  </head>
  <body th:style="'background-image: url(' + @{/img/common/images.png} + ');'">
    <header>
      <a href="#" th:href="@{/}"><img class="header-logo" th:src="@{/img/common/jigazo.PNG}"
          src="../../static/img/common/jigazo.PNG" /><strong>WebPortal.com</strong></a>
      <a href="#" th:href="@{/logout}"><img th:src="@{/img/common/exit.svg}"
          src="../../static/img/common/exit.svg" />ログアウト </a>
    </header>
    <main>
      <h1 class="page-title">ログイン 画面</h1>
      <div class="card">
        <div class="card-content">
          <form method="post" th:action="@{/login}">
            <!-- <label for="course">コースID</label>
            <input id="course" type="text" name="course"> -->
            <label for="loginid">ログインID</label>
            <input id="loginid" type="text" name="loginid" />
            <label for="password">パスワード</label>
            <input id ="password" type="password" name="password" />
            <!-- <label for="hyoji">  表示名</label>
            <input id ="hyoji" type="text" name="hyoji" /> -->
            <button type="submit">ログイン</button>
          </form>
        </div>
      </div>
    </main>
    <footer>&copy; 2026 WebPortal.com</footer>
  </body>
</html>
