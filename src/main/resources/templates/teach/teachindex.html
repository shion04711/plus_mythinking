<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebPortal.com</title>
    <link
      rel="icon"
      th:href="@{/img/common/favicon2.ico}"
      href="../../static/img/common/favicon2.ico"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css" />
  </head>
  <body th:style="'background-image: url(' + @{/img/common/images.png} + ');'">
    <div >
    <header>
      <a href="#" th:href="@{/}"
        ><img
          class="header-logo"
          th:src="@{/img/common/jigazo.PNG}"
          src="../static/img/common/jigazo.PNG"
        /><strong>WebPortal.com</strong></a
      >
      <a href="#" th:href="@{/teachlogout}"
        ><img th:src="@{/img/common/exit.svg}" src="../../static/img/common/exit.svg" />ログアウト
      </a>
    </header>
    <main>
      <h1 class="page-title"><span th:text="${session.userData.userName}">XXXX</span>教師側</h1>
      <div class="card">
        <div class="card-content">
          <h3>一般機能</h3>
          <ul>
            <li><a href="#" th:href="@{/mondai}"> 生徒 </a></li>

          </ul>
          <div>
            <h3>管理者機能</h3>
            <ul>
              <li>
                <a href="#" th:href="@{courseadd}"> コース追加 </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
      <!-- .card -->
    </main>
    <footer>&copy; 2026 WebPortal.com</footer>
    </div>
  </body>
</html>
