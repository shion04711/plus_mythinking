<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebPortal.com - 講師用分析ダッシュボード</title>
    <link
      rel="icon"
      th:href="@{/img/common/favicon2.ico}"
      href="../../static/img/common/favicon2.ico"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css" />
    <link rel="stylesheet" th:href="@{/css/report.css}" href="../../static/css/report.css" />
    <link rel="stylesheet" th:href="@{/css/bunseki.css}" href="../../static/css/bunseki.css" />

    <!-- Chart.js ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- 外部JSファイルの読み込み -->
    <script th:src="@{/js/tableSort.js}" src="../../static/js/tableSort.js"></script>
    <script th:src="@{/js/dashboard.js}" src="../../static/js/dashboard.js"></script>

    <style>
      .sortable {
        cursor: pointer;
        user-select: none;
        position: relative;
      }
      .sortable:hover {
        background-color: rgba(0, 0, 0, 0.05);
      }
      .sort-icon {
        font-size: 0.8em;
        margin-left: 4px;
        color: #888;
      }
      .student-detail-list {
        list-style: none;
        padding: 0;
        margin: 8px 0 0 0;
      }
      .student-detail-list li {
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body th:style="'background-image: url(' + @{/img/common/images.png} + ');'">
    <div>
      <header>
        <a href="#" th:href="@{/}">
          <img
            class="header-logo"
            th:src="@{/img/common/jigazo.PNG}"
            src="../static/img/common/jigazo.PNG"
          />
          <strong>WebPortal.com</strong>
        </a>
        <a href="#" th:href="@{/logout}">
          <img th:src="@{/img/common/exit.svg}" src="../../static/img/common/exit.svg" />ログアウト
        </a>
      </header>

      <main>
        <div class="card">
          <h1 class="page-title">情報収集画面</h1>
          <div class="card-content">
            
            <div class="dashboard-grid">
              <!-- 選択中の生徒の情報表示領域 -->
              <div class="student-info-box">
                <p class="fw-bold">選択中の生徒の情報</p>
                <ul class="student-detail-list">
                  <li><strong>名前:</strong> <span id="displayStudentName" th:text="${selectedStudentName}">未選択</span></li>
                  <li><strong>クラス番号:</strong> <span id="displayClassNum" th:text="${selectedClassNum}">-</span></li>
                  <li><strong>正答率:</strong> <span id="displayAccuracyRate" th:text="${selectedAccuracyRate}">-</span></li>
                  <li><strong>備考:</strong> <span id="displayStudentInfo" th:text="${selectedStudentInfo}">生徒を選択してください</span></li>
                </ul>
              </div>

              <div class="chart-container-box">
                <canvas id="reasonChart"></canvas>
              </div>
            </div>

            <div class="student-list-container">
              <div class="student-table-wrapper">
                <form th:action="@{/dashboard}" method="get" id="studentForm">
                  <table class="dashboard-table" id="studentTable">
                    <thead>
                      <tr>
                        <th style="width: 10%; text-align: center;">選択</th>
                        <th style="width: 20%;" class="sortable" data-sort="text" onclick="sortTable(1)">
                          生徒名<span class="sort-icon">⇅</span>
                        </th>
                        <th style="width: 15%;" class="sortable" data-sort="text" onclick="sortTable(2)">
                          クラス番号<span class="sort-icon">⇅</span>
                        </th>
                        <th style="width: 15%;" class="sortable" data-sort="rate" onclick="sortTable(3)">
                          正答率<span class="sort-icon">⇅</span>
                        </th>
                        <th style="width: 40%;">各生徒の情報</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="student : ${students}">
                        <td style="text-align: center;">
                          <!-- ラジオボタンに data-* 属性でデータ保持 -->
                          <input
                            type="radio"
                            name="studentId"
                            th:value="${student.id}"
                            th:data-name="${student.name}"
                            th:data-class="${student.classNum}"
                            th:data-rate="${student.accuracyRate}"
                            th:data-info="${student.info}"
                            th:data-careless="${student.carelessCount ?: 0}"
                            th:data-understanding="${student.lackOfUnderstandingCount ?: 0}"
                            th:data-time="${student.lackOfTimeCount ?: 0}"
                            th:data-other="${student.otherCount ?: 0}"
                            th:checked="${student.id == selectedStudentId}"
                            onchange="selectStudent(this)"
                          />
                        </td>
                        <td th:text="${student.name}">山田 太郎</td>
                        <td th:text="${student.classNum}">101</td>
                        <td th:text="${student.accuracyRate}">80%</td>
                        <td th:text="${student.info}">補足情報やステータス</td>
                      </tr>
                      <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="5" style="text-align: center;">生徒データがありません。</td>
                      </tr>
                    </tbody>
                  </table>
                </form>
              </div>
            </div>

          </div>
        </div>
      </main>

      <footer>&copy; 2026 WebPortal.com</footer>
    </div>
  </body>
</html>
