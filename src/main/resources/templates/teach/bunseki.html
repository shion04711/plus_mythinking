          <div class="card-content">
            
            <form th:action="@{/dashboard}" method="get" id="dashboardForm">
              
              <!-- ▼ デイリー / 総括 切替トグルスイッチ -->
              <div class="mode-switch-container">
                <div class="segmented-control">
                  <input
                    type="radio"
                    id="modeDaily"
                    name="mode"
                    value="daily"
                    checked
                    onchange="toggleMode('daily')"
                  />
                  <label for="modeDaily">デイリー（本日）</label>

                  <input
                    type="radio"
                    id="modeSummary"
                    name="mode"
                    value="summary"
                    onchange="toggleMode('summary')"
                  />
                  <label for="modeSummary">総括（全期間）</label>
                </div>
              </div>

              <!-- ダッシュボード グリッド領域 -->
              <div class="dashboard-grid">
                <!-- 選択中の生徒の情報表示領域 -->
                <div class="student-info-box">
                  <p class="fw-bold">
                    選択中の生徒の情報
                    <span class="badge" th:text="${mode == 'summary' ? '【総括】' : '【デイリー】'}" style="font-size:0.8em; color:#3182ce;"></span>
                  </p>
                  <ul class="student-detail-list">
                    <li><strong>名前:</strong> <span id="displayStudentName" th:text="${selectedStudentName}">未選択</span></li>
                    <li><strong>クラス番号:</strong> <span id="displayClassNum" th:text="${selectedClassNum}">-</span></li>
                    <li><strong>ミスの数:</strong> <span id="displayMissCount" th:text="${selectedMissCount}">-</span></li>
                    <li><strong>備考:</strong> <span id="displayStudentInfo" th:text="${selectedStudentInfo}">生徒を選択してください</span></li>
                  </ul>
                </div>

                <div class="chart-container-box">
                  <canvas id="reasonChart"></canvas>
                </div>
              </div>

              <!-- 生徒一覧テーブル -->
              <div class="student-list-container">
                <div class="student-table-wrapper">
                  <table class="dashboard-table" id="studentTable">
                    <thead>
                      <tr>
                        <th style="width: 10%; text-align: center;">選択</th>
                        <th style="width: 20%;" class="sortable" data-sort="text" onclick="sortTable(1)">
                          生徒名<span class="sort-icon">⇅</span>
                        </th>
                        <th style="width: 15%;" class="sortable" data-sort="text" onclick="sortTable(2)">
                          クラス番号<span class="sort-icon">⇅</span>
                        </th>
                        <th style="width: 15%;" class="sortable" data-sort="number" onclick="sortTable(3)">
                          ミスの数<span class="sort-icon">⇅</span>
                        </th>
                        <th style="width: 40%;">各生徒の情報</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="student : ${students}">
                        <td style="text-align: center;">
                          <!-- 生徒データ保持用ラジオボタン（コメントはタグの外に配置） -->
                          <input
                            type="radio"
                            name="studentId"
                            th:value="${student.id}"
                            th:data-name="${student.name}"
                            th:data-class="${student.classNum}"
                            th:data-daily-miss="${student.dailyMissCount ?: 0}"
                            th:data-daily-info="${student.dailyInfo}"
                            th:data-daily-careless="${student.dailyCarelessCount ?: 0}"
                            th:data-daily-understanding="${student.dailyLackOfUnderstandingCount ?: 0}"
                            th:data-daily-time="${student.dailyLackOfTimeCount ?: 0}"
                            th:data-daily-other="${student.dailyOtherCount ?: 0}"
                            th:data-summary-miss="${student.summaryMissCount ?: 0}"
                            th:data-summary-info="${student.summaryInfo}"
                            th:data-summary-careless="${student.summaryCarelessCount ?: 0}"
                            th:data-summary-understanding="${student.summaryLackOfUnderstandingCount ?: 0}"
                            th:data-summary-time="${student.summaryLackOfTimeCount ?: 0}"
                            th:data-summary-other="${student.summaryOtherCount ?: 0}"
                            onchange="selectStudent(this)"
                          />
                        </td>
                        <td th:text="${student.name}">山田 太郎</td>
                        <td th:text="${student.classNum}">101</td>
                        <td class="miss-cell" th:text="${student.dailyMissCount != null ? student.dailyMissCount + '回' : '0回'}">0回</td>
                        <td class="info-cell" th:text="${student.dailyInfo}">補足情報</td>
                      </tr>
                      <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="5" style="text-align: center;">生徒データがありません。</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

            </form>
          </div>
        </div>
      </main>
    </div>
  </body>
