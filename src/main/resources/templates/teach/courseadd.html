<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebPortal.com</title>
  <link rel="icon" th:href="@{/img/common/favicon.ico}" href="../../static/img/common/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css" />
</head>

<body>
  <header>
<a href="#" th:href="@{/}">
  <img class="header-logo-main" th:src="@{/img/icon3.png}"
      src="../../static/img/icon3.png" />
  <strong>PLUS</strong>
</a>
<a href="#" th:href="@{/studentlogout}">
  <img class="header-logo-exit" th:src="@{/img/common/exit.svg}"
      src="../../static/img/common/exit.svg" />
  ログアウト
</a>
  </header>
  <main>
    <h1 class="page-title">コース作成画面</h1>
    <div class="card text-center">
      <div class="card-content">
        <div>
          <!-- Controllerの model.addAttribute("errormessage", ...) と一致 -->
          <p class="error-message" th:if="${errormessage}" th:text="${errormessage}">エラーメッセージ</p>

          <!-- POST送信先の設定 -->
          <form method="post" th:action="@{/courseadd}">
            
            <label for="courseId">コースID</label>
            <!-- name 属性を Java 側のプロパティ名 (courseId) に合わせる -->
            <input id="courseId" type="text" name="courseId" required />

            <label for="courseName">コース名</label>
            <!-- name 属性を Java 側のプロパティ名 (courseName) に合わせる -->
            <input id="courseName" type="text" name="courseName" required />

            <fieldset>
              <legend>期間</legend>
              <label for="start">開始日</label>
              <!-- CourseFormのプロパティ名に合わせて name="start" (または startDate) に指定 -->
              <input id="start" type="date" name="start" required />
              
              <label for="end">終了日</label>
              <!-- CourseFormのプロパティ名に合わせて name="end" (または endDate) に指定 -->
              <input id="end" type="date" name="end" required />
            </fieldset>
            
            <button type="submit">作成</button>
          </form>
        </div>
      </div>
    </div>
    <!-- .card -->
  </main>
</body>

</html>
