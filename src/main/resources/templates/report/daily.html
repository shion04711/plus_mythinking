<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebPortal.com</title>
  <link rel="icon" th:href="@{/img/common/favicon.ico}" href="../static/img/common/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css" />
  <link rel="stylesheet" th:href="@{/css/report.css}" href="../../static/css/report.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <header>
    <a href="#" th:href="@{/}"><img class="header-logo-main" th:src="@{/img/icon3.png}"
        src="../../static/img/icon3.png" /><strong> PLUS</strong></a>
    <a href="#" th:href="@{/logout}"><img class="header-logo-exit" th:src="@{/img/common/exit.svg}"
        src="../../static/img/common/exit.svg" />ログアウト </a>
  </header>
  <main>
    <h1 class="page-title">デイリーレポート</h1>
    <div class="card text-center">
      <div class="card-content">
        <div class="daily-report-wrapper">
          <div class="report-container">
            
            <div class="report-item">
              <div class="report-row">
                <span class="label">勉強時間</span>
                <span class="value" th:text="${dailytime}">XXX</span>
              </div>
              <div class="report-row">
                <span class="label">プリント枚数</span>
                <span class="value" th:text="${dailyprint}">XXX</span>
              </div>
            </div>

            <div class="report-item">
              <div class="report-row">
                <span class="label">累計勉強時間</span>
                <span class="value" th:text="${alltime}">XXX</span>
              </div>
              <div class="report-row">
                <span class="label">累計プリント枚数</span>
                <span class="value" th:text="${allmaisu}">XXX</span>
              </div>
            </div>

            <div class="report-item">
              <span class="label">間違えた原因</span>
              <div class="chart-container">
                <canvas id="reasonChart"></canvas>
              </div>
            </div>

            <div class="report-item">
              <span class="label">今までのデータとの比較</span>
              <p class="value" th:text="${sikentext}">XXXXXX</p>
            </div>

            <div class="report-item">
              <span class="label">次回気を付けること</span>
              <p class="value" th:text="${nextAdviceText}">XXXXXX</p>
            </div>

          </div>
        </div>
      </div>
    </div>
    <!-- .card -->
  </main>

  <!-- Thymeleafから渡される reasonCounts（ID 1〜8の件数リスト）を受け取ってグラフを描画 -->
  <script th:inline="javascript">
    // Controllerから渡された reasonCounts（8要素のリスト）を取得（初期表示・テスト用フォールバック付）
    const rawReasonCounts = /*[[${reasonCounts}]]*/ [0, 0, 0, 0, 0, 0, 0, 0];

    // 8個の要素数になるよう補正（NULL対策・配列長不足対策）
    const reasonCountsData = Array.isArray(rawReasonCounts) ? rawReasonCounts : [];
    while (reasonCountsData.length < 8) {
      reasonCountsData.push(0);
    }

    const ctx = document.getElementById('reasonChart').getContext('2d');
    new Chart(ctx, {
      type: 'pie',
      data: {
        labels: [
          '理解不足',
          '知識不足',
          '時間切れ',
          '思い込み',
          '読み間違い',
          '書き間違い',
          '計算ミス',
          'ケアレスミス（その他）'
        ], 
        datasets: [{
          data: reasonCountsData,
          backgroundColor: [
            '#36a2eb', // 1: 理解不足
            '#4bc0c0', // 2: 知識不足
            '#ffce56', // 3: 時間切れ
            '#9966ff', // 4: 思い込み
            '#ff9f40', // 5: 読み間違い
            '#e75480', // 6: 書き間違い
            '#ff6384', // 7: 計算ミス
            '#c9cbcf'  // 8: ケアレスミス（その他）
          ],
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              boxWidth: 12,
              padding: 15
            }
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                const label = context.label || '';
                const value = context.parsed || 0;
                const total = context.dataset.data.reduce((sum, val) => sum + val, 0);
                const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                return `${label}: ${value}件 (${percentage}%)`;
              }
            }
          }
        }
      }
    });
  </script>

</body>

</html>
