  <script th:inline="javascript">
    /* Controllerから渡された reasonCounts を取得 (データがない場合の初期値をフォールバック指定) */
    const reasonCountsData = /*[[${reasonCounts}]]*/ [40, 30, 20, 10];

    const ctx = document.getElementById('reasonChart').getContext('2d');
    new Chart(ctx, {
      type: 'pie', // 円グラフを指定
      data: {
        labels: ['ケアレスミス', '理解不足', '時間不足', 'その他'], 
        datasets: [{
          data: reasonCountsData, // 受け取った動的データをセット
          backgroundColor: [
            '#ff6384',
            '#36a2eb',
            '#ffce56',
            '#cc65fe'
          ],
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              padding: 25
            }
          }
        }
      }
    });
  </script>
