<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebPortal.com</title>
  <link rel="icon" th:href="@{/img/common/favicon.ico}" href="../static/img/common/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css" />
</head>

<body>
  <header>
    <a href="#" th:href="@{/}"><img class="header-logo" th:src="@{/img/common/webportal.png}"
        src="../static/img/common/webportal.png" /><strong>WebPortal.com</strong></a>
  </header>
  <main>
    <div class="card text-center">
      <div class="card-content">
        <h1>コース作成画面</h1>
        <div>
          <p class="error-message" th:if="${errormessage}" th:text="${errormessage}">ログインエラーメッセージ</p>

          <form method="post" th:action="@{/courseadd}">
            <label for="course_id">コースID</label>
            <input id="course_id" type="text" name="course_id" />
            <label for="course_name">コース名</label>
            <input id="course_name" type="text" name="course_name" />
            <p>期間</p>
            <label for="start-date">開始日</label>
            <input id="start-date" type="date" name="start"  placeholder="開始日"/>
            <label for="end-date">終了日</label>
            <input id="end-date" type="date" name="end" placeholder="終了日"/>
            <button type="submit">作成</button>
          </form>
        </div>
      </div>
    </div>
    <!-- .card -->
  </main>
  <footer>&copy; plus.com</footer>
</body>

</html>
